<!doctype html>
<html lang="en-DK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device.width" />
    <title>Auth tester</title>
  </head>

  <body>
    <h1>Dash Simple Auth Test</h1>

    <a href="/index.html">
      <button id="index-page-btn">Home</button>
    </a>
    <a href="/login.html">
      <button id="login-page-btn">Login Page</button>
    </a>
    <a href="/register.html">
      <button id="register-page-btn">Register Page</button>
    </a>
    <a href="/mypage.html">
      <button id="mypage-page-btn">My Page</button>
    </a>
    
    <from action="" method="">
      <h2>Login</h2>
      <p>
        <label for="username/email">Username/Email:</label>
        <input type="text" name="username/email" id="username/email" required />
      </p>
      <p>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required />
      </p>
      <p>
        <button>Login!</button>
      </p>
    </from>
  </body>
</html>

  <body>

    <a href="/index.html">

    <a href="/login.html">

    <form action="" method="">
      <h2>Register</h2>
      <p>
        <label for="email">Email:</label>
        <input type="text" name="email" id="email" required />
      </p>
      <p>
        <label for="username">Username:</label>
        <input type="text" name="usernamel" id="username" required />

        <button>Register!</button>
      </p>
    </form>

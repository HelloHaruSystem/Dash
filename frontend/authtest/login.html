<!doctype html>
<html lang="en-DK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth tester</title>
    <script src="./src/app.js" defer></script>
  </head>

  <body>
    <h1>Dash Simple Auth Test</h1>

    <nav>
      <button onclick="location.href = 'index.html'">Home</button>
      <button id="loginBtn" onclick="location.href = 'login.html'">
        Login
      </button>
      <button id="registerBtn" onclick="location.href = 'register.html'">
        Register
      </button>
      <button id="myPageBtn" onclick="location.href = 'mypage.html'">
        My Page
      </button>
    </nav>

    <form id="login-form">
      <h2>Login</h2>
      <p>
        <label for="identifier">Username/Email:</label>
        <input type="text" name="identifier" id="identifier" required />
      </p>
      <p>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required />
      </p>
      <p>
        <button>Login!</button>
      </p>
    </form>
  </body>
</html>
